<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>본인 인증</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/authentication.css">
    <script src="js/authentication.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <div id="logo">
                <h1 id="input-logo">
                    <a href="index.html">
                        <img src="./images/ksh_logo-1.png" alt="KSH Logo">
                    </a>
                </h1>
            </div> 
        </header>

        <!-- 메인 컨텐츠 -->
        <main>
            <h2>본인 인증</h2>
            <p class="subtitle">안전한 서비스 이용을 위해 인증 방식을 선택해주세요.</p>

            <!-- 인증 수단 선택 리스트 -->
            <div class="auth-method-list">
                
                <!-- 1. 휴대폰 인증 -->
                <div id="method-phone" class="auth-card" data-method="phone">
                    <div class="auth-icon">📱</div>
                    <div class="auth-info">
                        <span class="auth-name">휴대폰 인증</span>
                        <span class="auth-desc">통신사 문자 메시지로 인증합니다.</span>
                    </div>
                    <div class="check-circle"></div>
                </div>

                <!-- 2. 아이핀 인증 -->
                <div id="method-ipin" class="auth-card" data-method="ipin">
                    <div class="auth-icon">🆔</div>
                    <div class="auth-info">
                        <span class="auth-name">아이핀(i-PIN) 인증</span>
                        <span class="auth-desc">발급받은 아이핀 ID로 인증합니다.</span>
                    </div>
                    <div class="check-circle"></div>
                </div>

                <!-- 3. 토스 인증 -->
                <div id="method-toss" class="auth-card" data-method="toss">
                    <div class="auth-icon">🔵</div>
                    <div class="auth-info">
                        <span class="auth-name">토스(Toss) 인증</span>
                        <span class="auth-desc">토스 앱 푸시 알림으로 인증합니다.</span>
                    </div>
                    <div class="check-circle"></div>
                </div>
            </div>

            <button id="main-auth-btn" class="submit-btn" disabled>인증 수단을 선택해주세요</button>
            <div id="auth-message"></div>

            <div class="button-group">
                <button id="cancel-btn" class="action-btn btn-cancel">취소</button>
                <button id="next-btn" class="action-btn btn-next">다음 단계</button>
            </div>

            <div id="modal-overlay">
                <div class="modal-box">
                    <h3 id="modal-title">인증번호 입력</h3>
                    <p>방금 발송된 인증번호 6자리를 입력해주세요.<br>(테스트용 알림창 확인)</p>
                    <input type="text" id="modal-input" maxlength="6" placeholder="123456" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                    <div class="modal-btns">
                        <button class="btn-close" onclick="closeModal()">닫기</button>
                        <button class="btn-confirm" onclick="verifyCode()">확인</button>
                    </div>
                </div>
            </div>

        </main>
    </div>
</body>
</html>
